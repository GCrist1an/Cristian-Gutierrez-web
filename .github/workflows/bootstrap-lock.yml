name: Bootstrap lockfile

on:
  push:
    branches:
      - agent/fase-1b-fundacion-web-personal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message || '', 'chore: generar package-lock') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Generar package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Guardar lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya está actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generar package-lock"
          git push
